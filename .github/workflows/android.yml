name: Android CI (DSH Client)

on:
  push:
    branches: ["android-dsh"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_COMPILE_SDK: "36"
      ANDROID_BUILD_TOOLS: "36.1.0"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      # Release signing (decoded from GitHub Secrets in the step below).
      ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_FILE: ${{ github.workspace }}/dsh-release.p12
      ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_ALIAS: deepseekharness
      ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Decode signing keystore
        run: echo "${{ secrets.DSH_RELEASE_KEYSTORE_B64 }}" | base64 -d > ${{ github.workspace }}/dsh-release.p12

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed release APK (play flavor)
        run: |
          ./gradlew :app:assemblePlayRelease \
            -PdeepseekHarnessBuildCommit="$(git rev-parse HEAD)" \
            -PdeepseekHarnessBuildTimestamp="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-release
          path: app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" \
            --title "DeepSeek Harness ${VERSION}" \
            --notes "DeepSeek Harness Android 正式版 ${VERSION}。\n\n安装：下载 APK，允许「未知来源」安装即可；同版本号更新可直接覆盖安装，无需卸载。\n\n更新日志见下方附件。" \
            app/build/outputs/apk/play/release/*.apk
