name: Android CI

on:
  push:
    branches: ["feature/android-dsh"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORKDIR: "."
      GRADLE_VERSION: "8.9"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -sSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Make gradlew executable (if present)
        working-directory: ${{ env.WORKDIR }}
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Build debug APK
        working-directory: ${{ env.WORKDIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug
          path: ${{ env.WORKDIR }}/app/build/outputs/apk/debug/*.apk
