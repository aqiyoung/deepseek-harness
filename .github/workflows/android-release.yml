name: Android Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_FILE: ${{ github.workspace }}/dsh-release.p12
  ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
  ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_ALIAS: deepseekharness
  ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_PASSWORD: ${{ secrets.DSH_KEYSTORE_PASSWORD }}

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Decode signing keystore
        run: echo "${{ secrets.DSH_RELEASE_KEYSTORE_B64 }}" | base64 -d > ${{ github.workspace }}/dsh-release.p12

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk